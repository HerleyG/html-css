<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <H1>Imagem dinãmica</H1>
    <p>Tente abrir este site em  vários dispositivos diferntes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
               <!--se for menos de 1000px, vai carregar a foto m(700px)-->
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexivel"> <!-- Por padrao a imagem vai ser carregada GRANDE-->
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <!-- MP3 WAV OGG-->
     <audio preload="metadata" autoplay controls>
        <source src="mídia/Intergalactic - Alex Jones _ Xander Jones.mp3" type="audio/mpeg">
        <source src="mídia/Intergalactic - Alex Jones _ Xander Jones.ogg" type="audio/ogg">
        <source src="mídia/Intergalactic - Alex Jones _ Xander Jones.wav" type="audio/wav">
        <p>infelizmente seu navegador não consegue reproduzir este áudio. <a href="mídia/Intergalactic - Alex Jones _ Xander Jones.mp3">clique aqui para baixar o audio em mp3</a></p>
     </audio>
</body>
</html>
