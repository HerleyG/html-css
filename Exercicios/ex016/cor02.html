<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * { /*configurações globais das CSS*/ 
            height: 100%;
        }
        body {
            background-image: linear-gradient(to left, #260104, #D90B1C, #A60815, #8C041D, #0D0D0D);
        }
        h1 {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
